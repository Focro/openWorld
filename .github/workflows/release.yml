name: Release

# Когда в main приходит новая версия (поле version в package.json),
# автоматически создаёт тег vX.Y.Z и релиз с описанием из CHANGELOG.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Создать релиз для новой версии
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Релиз есть. Если его тег стоит на коммите из текущей истории main, ничего не делаем.
            # Если тег держит старую (переписанную) историю, удаляем релиз и тег и создаём заново.
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
            OLD=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)
            if [ -n "$OLD" ] && git merge-base --is-ancestor "$OLD" "$GITHUB_SHA" 2>/dev/null; then
              echo "Релиз $TAG уже есть, пропускаю."
              exit 0
            fi
            echo "Тег $TAG не из текущей истории main: пересоздаю релиз."
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { f=1; next }
            /^## / { if (f) exit }
            f
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Подробности в CHANGELOG.md." > notes.md
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "OpenWorld $VERSION" \
            --notes-file notes.md --prerelease
