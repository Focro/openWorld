name: Ошибка / Bug
description: Что-то работает не так / Something is broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Что случилось / What happened
      description: Что ты сделал и что пошло не так / What you did and what went wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидал / What you expected
  - type: input
    id: device
    attributes:
      label: Устройство и браузер / Device and browser
      placeholder: "Android, Chrome"
  - type: input
    id: version
    attributes:
      label: Версия игры / Game version
      placeholder: "0.14.0"
